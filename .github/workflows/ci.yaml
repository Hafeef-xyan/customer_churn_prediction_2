name: Customer Churn CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Add Python to PATH
        run: |
          "C:\Users\DELL\AppData\Local\Programs\Python\Python310" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Users\DELL\AppData\Local\Programs\Python\Python310\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: check python
        run : python --version
      
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API tests
        env: 
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python -m pytest tests/ -v

