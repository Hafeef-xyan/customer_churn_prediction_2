name: Customer Churn CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: check python
        run: python --version
      
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check MLflow connection
        shell: powershell
        run: |
          Write-Host "MLflow URI: $env:MLFLOW_TRACKING_URI"
          Invoke-WebRequest http://127.0.0.1:5000/ -UseBasicParsing
          
      - name: Run API tests
        run: python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t customer-churn-api:ci .